<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Timer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0F0F0F 0%, #1A1A1A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #E5E5E5;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
    }

    .timer-main {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cue-title {
      font-size: 56px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #E5E5E5;
      line-height: 1.2;
    }

    .cue-speaker {
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 40px;
      opacity: 0.8;
      font-style: italic;
      color: #B0B0B0;
    }

    .timer-display {
      font-size: 400px;
      font-weight: 700;
      font-family: 'DM Mono', 'Monaco', 'Courier New', monospace;
      margin-bottom: 30px;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      letter-spacing: 15px;
      color: #FFFFFF;
      line-height: 0.8;
      text-align: center;
    }

    .progress-bar {
      height: 8px;
      background: rgba(90, 90, 90, 0.2);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 30px;
      border: 1px solid #3A3A3A;
      width: 600px;
      max-width: 100%;
    }

    .progress-fill {
      height: 100%;
      transition: width 1s linear;
      background: linear-gradient(90deg, #5A5A5A 0%, #8A8A8A 100%);
    }

    .cue-info {
      font-size: 28px;
      margin-bottom: 30px;
      color: #B0B0B0;
    }

    .cue-position {
      font-weight: 600;
      color: #E5E5E5;
    }

    .next-cue {
      font-size: 24px;
      opacity: 0.8;
      font-style: italic;
      color: #B0B0B0;
    }

    .message-display {
      background: linear-gradient(135deg, #2A2A2A 0%, #1A1A1A 100%);
      border: 3px solid #FFB74D;
      border-radius: 12px;
      padding: 40px 30px;
      max-width: 700px;
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 30px rgba(255, 183, 77, 0.3), inset 0 0 20px rgba(255, 183, 77, 0.1);
      animation: messagePulse 0.5s ease-out;
    }

    @keyframes messagePulse {
      from {
        transform: scale(0.95);
        opacity: 0.8;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .message-text {
      font-size: 48px;
      font-weight: 700;
      color: #FFE082;
      text-align: center;
      line-height: 1.4;
      word-wrap: break-word;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .message-display.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="timer-main">
    <div class="cue-title" id="cueTitle">Ready</div>
    <div class="cue-speaker" id="cueSpeaker"></div>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="cue-info">
      <div class="cue-position" id="cuePosition">Cue 1 of 1</div>
      <div class="next-cue" id="nextCue"></div>
    </div>
    <div class="message-display hidden" id="messageDisplay">
      <div class="message-text" id="messageText"></div>
    </div>
  </div>

  <script>
    const cues = JSON.parse(sessionStorage.getItem('presentationCues') || '[]')
    const showTimeRemaining = JSON.parse(sessionStorage.getItem('showTimeRemaining') || 'true')
    let currentCueIndex = 0
    let elapsed = 0
    let isRunning = true
    let timerInterval = null

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60)
      const secs = seconds % 60
      return `${mins}:${secs.toString().padStart(2, '0')}`
    }

    function updateDisplay() {
      if (!cues.length) return

      const currentCue = cues[currentCueIndex]
      const isOvertime = elapsed >= currentCue.seconds

      document.getElementById('cueTitle').textContent = currentCue.title
      document.getElementById('cueSpeaker').textContent = currentCue.speaker || ''

      let displayTime
      if (isOvertime) {
        displayTime = elapsed - currentCue.seconds
      } else {
        displayTime = showTimeRemaining ? currentCue.seconds - elapsed : elapsed
      }

      document.getElementById('timerDisplay').textContent = `${isOvertime ? '+' : ''}${formatTime(displayTime)}`

      const progress = isOvertime ? 100 : (elapsed / currentCue.seconds) * 100
      document.getElementById('progressFill').style.width = `${progress}%`

      document.getElementById('cuePosition').textContent = `Cue ${currentCueIndex + 1} of ${cues.length}`

      if (currentCueIndex < cues.length - 1) {
        const nextCue = cues[currentCueIndex + 1]
        document.getElementById('nextCue').textContent = `Next: ${nextCue.title} (${formatTime(nextCue.seconds)})`
      } else {
        document.getElementById('nextCue').textContent = ''
      }

      // Update timer color based on progress
      const displayElement = document.getElementById('timerDisplay')
      if (isOvertime) {
        displayElement.style.color = '#FF5252'
      } else {
        const remainingPercent = (displayTime / currentCue.seconds) * 100
        if (remainingPercent > 50) {
          displayElement.style.color = '#FFFFFF'
        } else if (remainingPercent > 25) {
          displayElement.style.color = '#FFB74D'
        } else {
          displayElement.style.color = '#FF5252'
        }
      }
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval)
      timerInterval = setInterval(() => {
        if (isRunning) {
          elapsed++
          updateDisplay()
        }
      }, 1000)
    }

    // Listen for messages from the main window
    window.addEventListener('message', (event) => {
      if (event.data.type === 'CUE_CHANGED') {
        currentCueIndex = event.data.index
        elapsed = 0
        updateDisplay()
      } else if (event.data.type === 'MESSAGE') {
        document.getElementById('messageText').textContent = event.data.text
        document.getElementById('messageDisplay').classList.remove('hidden')
      } else if (event.data.type === 'CLEAR_MESSAGE') {
        document.getElementById('messageDisplay').classList.add('hidden')
      } else if (event.data.type === 'TOGGLE_TIMER') {
        isRunning = event.data.isRunning
      }
    })

    // Close event handler
    window.addEventListener('beforeunload', () => {
      window.opener.postMessage({ type: 'TIMER_CLOSED' }, '*')
    })

    // Initialize
    if (cues.length > 0) {
      updateDisplay()
      startTimer()
    }
  </script>
</body>
</html>
